<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lineage Nexus: Heritage AI Research</title>
  <meta name="description"
    content="An advanced AI-powered genealogical research assistant for exploring Dutch archives and WikiTree profiles." />
  <link rel="canonical" href="https://lineage.nexus/" />

  <!-- Theme colours are the light/dark surface tokens from index.css, so the
       browser chrome matches the page instead of flashing white. -->
  <meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D1A2B" media="(prefers-color-scheme: dark)" />

  <!-- Link previews. Without these a shared link renders as a bare card. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lineage Nexus" />
  <meta property="og:title" content="Lineage Nexus: Heritage AI Research" />
  <meta property="og:description"
    content="An AI research assistant for Dutch genealogy — searches the archives, drafts sourced WikiTree biographies." />
  <meta property="og:url" content="https://lineage.nexus/" />
  <meta property="og:image" content="https://lineage.nexus/logo.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lineage Nexus: Heritage AI Research" />
  <meta name="twitter:description"
    content="An AI research assistant for Dutch genealogy — searches the archives, drafts sourced WikiTree biographies." />
  <script>
    // Resolve the theme before first paint so a stored preference never flashes
    // the wrong palette. Keep in sync with src/useTheme.js.
    (function () {
      try {
        var pref = localStorage.getItem('lineage_theme') || 'system';
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
