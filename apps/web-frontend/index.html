<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lineage Nexus: Heritage AI Research</title>
  <meta name="description"
    content="An advanced AI-powered genealogical research assistant for exploring Dutch archives and WikiTree profiles." />
  <script>
    // Resolve the theme before first paint so a stored preference never flashes
    // the wrong palette. Keep in sync with src/useTheme.js.
    (function () {
      try {
        var pref = localStorage.getItem('lineage_theme') || 'system';
        var dark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
